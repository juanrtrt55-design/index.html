


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CarPlayer - Pro Original Optimized</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>
@media (orientation: portrait){
    body::before{
        content:"GIRA EL MÓVIL";
        position:fixeda inset:0; background:#000; color:#fff; z-index:9999;
        display:flex; align-items:center; justify-content:center; font-size:10vw;
    }
}
:root{
    --accent:#ff0000; 
    --bg:#000;
    --btn:#222;
    --text:#fff;
    --panel-bg:#111;
    --neon-blue: #00f2ff;
}
/* ELIMINA EL RECUADRO VERDE/TRANSPARENTE AL TOCAR */
*{ 
    box-sizing:border-box; 
    margin:0; padding:0; 
    font-family:system-ui,Arial; 
    color:var(--text);
    -webkit-tap-highlight-color: transparent;
}
body{ background:var(--bg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

#fs-wrapper.mp3-active {
    background-image: url('https://raw.githubusercontent.com/Juancito221/.../refs/heads/main/dvd_audio_425.jpg'); 
    background-size: cover;
    background-position: center;
}
#fs-wrapper.mp3-active video { opacity: 0; }

video::-webkit-media-controls { display:none !important; }

.audio-only .panel:first-child { display: none !important; }
.audio-only #center { flex: 1 !important; }

#top{ flex:1; display:flex; gap:.5rem; padding:.5rem; min-height:0; }
.panel{ flex:1; display:flex; flex-direction:column; background:var(--panel-bg); border-radius:1vh; overflow:hidden; position:relative; }

video{ width:100%; height:100%; flex:1; background:#000; object-fit: contain; pointer-events: none; transition: opacity 0.3s; }

#fs-wrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

#center{
    background:#0005;
    border-radius:1vh;
    padding:1vh;
    display:flex;
    flex-direction:column;
    gap:1vh;
    min-width:36vh;
    overflow-y:auto;
    flex: 0 0 40%;
    scroll-behavior: smooth;
}

.track{
    display:flex; align-items:center; justify-content:center;
    padding:1.5vh; background:var(--btn); border-radius:1vh;
    cursor:pointer; height:9vh; flex-shrink:0; border: 1px solid #333;
}
.track-info{ text-align: center; overflow: hidden; width: 100%; }
.track-title{ font-size:3.2vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight: bold; display: block; }
.track-genre{ font-size:2vh; opacity:0.6; text-transform: uppercase; }
.track.active{ background:var(--accent); border: 3px solid #fff; }

#bottom{ display:flex; align-items:center; gap:1vh; padding:1vh; background:#0005; }

#fixed-mp3-btn, #local-btn {
    background: var(--btn); border: 1px solid var(--neon-blue);
    color: var(--neon-blue); padding: 1vh 2vh; border-radius: 1vh;
    font-weight: bold; height: 7vh; flex: none; cursor: pointer;
}

button{
    flex:1; height:11vh; border:none; border-radius:1.5vh;
    background:var(--btn); color:var(--text); font-weight:700;
    font-size:5vh; cursor:pointer;
}

#progress{
    height:3.5vh; background:#333; border-radius:1.5vh;
    cursor:pointer; margin:0 1vh; position: relative; overflow: hidden;
}
#bar{ height:100%; background:var(--accent); width:0%; position: absolute; transition: width 0.1s linear; }

#song-time {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 2.2vh; font-weight: bold; z-index: 5;
    text-shadow: 1px 1px 2px #000; font-family: monospace; pointer-events: none;
}

#filters-container { display: flex; align-items: center; background: #0005; padding: 1vh; gap: 1vh; height: 9vh; overflow: hidden; }
#genre-scroller { display: flex; gap: 1vh; overflow-x: auto; scrollbar-width: none; flex: 1; height: 100%; align-items: center; }

.filter-btn { 
    background: var(--btn); border: none; padding: 1vh 2.5vh; 
    border-radius: 1vh; white-space: nowrap; font-size: 2.2vh; height: 7vh; flex: none;
}
.filter-btn.active{ background:var(--accent); border: 1px solid #fff; }

#safeDrive{ padding:1vh; font-size:2.5vh; display: flex; align-items: center; justify-content: space-between; gap: 1vh; }
.bass-mini { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 10px; height: 6vh; }
#slider { width: 90px; accent-color: var(--neon-blue); cursor: pointer; }
#dbVal { font-weight: bold; color: var(--neon-blue); min-width: 20px; font-size: 2vh; }

#fullscreen-container {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 10000; flex-direction: column; justify-content: center; align-items: center;
}
#fullscreen-container.active { display: flex; }
#fs-controls {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; background: rgba(0,0,0,0.7); padding: 15px 25px;
    border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); opacity: 0;
    transition: opacity 0.4s ease; pointer-events: auto; z-index: 10001;
}
#fs-controls.visible { opacity: 1; }
#fs-controls button { background: transparent; font-size: 6vh; width: 12vh; height: 12vh; border: none; flex: none; }
</style>
</head>
<body>

<input type="file" id="local-input" multiple accept="audio/*,video/*" style="display:none" onchange="handleFiles(this.files)">

<div id="top">
    <div id="fs-wrapper" class="panel">
        <video id="vP" crossorigin="anonymous" muted playsinline preload="metadata"></video>
    </div>
    <div id="center"></div>
</div>

<div id="filters-container">
    <button id="fixed-mp3-btn" onclick="toggleSourceType()">MP3</button>
    <button id="local-btn" onclick="document.getElementById('local-input').click()">📁 LOCAL</button>
    <div id="genre-scroller"></div>
</div>

<div id="progress">
    <div id="bar"></div>
    <div id="song-time">00:00 / 00:00</div>
</div>

<div id="bottom">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
    <button id="toggleMute">🔇</button>
    <button id="fullscreen">⛶</button>
</div>

<div id="safeDrive">
    <div>
        <input type="checkbox" id="driving">
        <label for="driving">Modo Conducción</label>
    </div>
    <div class="bass-mini">
        <span style="font-size:1.2vh; color:var(--neon-blue); font-weight:bold;">EQ</span>
        <input type="range" id="slider" min="0" max="19" value="0">
        <div id="dbVal">0</div>
    </div>
</div>

<div id="fullscreen-container" onclick="toggleFSUI()">
    <div id="fs-controls">
        <button onclick="prevT(event)">⏮</button>
        <button id="play-fs" onclick="playT(event)">▶</button>
        <button onclick="nextT(event)">⏭</button>
        <button onclick="exitFS(event)">◼️</button>
    </div>
</div>

<script>
const vP = document.getElementById('vP');
const bar = document.getElementById('bar');
const progressCont = document.getElementById('progress');
const songTimeDisplay = document.getElementById('song-time');
const genreScroller = document.getElementById('genre-scroller');
const fsContainer = document.getElementById('fullscreen-container');
const fsControls = document.getElementById('fs-controls');

let PLAYLIST = [];
let FILTERED_PLAYLIST = [];
let LOCAL_PLAYLIST = [];
let idx = parseInt(localStorage.getItem('carIdx')) || 0;
let isMp3Mode = false;
let fsUITimer;

// MOTOR DE AUDIO ORIGINAL
let audioCtx, src, gainNode, deepEngine, subLow, clarity, air, limiter, analyzer;
function initAudioEngine() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    src = audioCtx.createMediaElementSource(vP);
    analyzer = audioCtx.createAnalyser();
    analyzer.fftSize = 256;
    gainNode = audioCtx.createGain(); gainNode.gain.value = 0.4;
    deepEngine = audioCtx.createBiquadFilter(); deepEngine.type = "peaking"; deepEngine.frequency.value = 45; deepEngine.Q.value = 5.1; deepEngine.gain.value = 0;
    subLow = audioCtx.createBiquadFilter(); subLow.type = "lowshelf"; subLow.frequency.value = 90; subLow.gain.value = 2;
    clarity = audioCtx.createBiquadFilter(); clarity.type = "peaking"; clarity.frequency.value = 3000; clarity.gain.value = 11;
    air = audioCtx.createBiquadFilter(); air.type = "highshelf"; air.frequency.value = 50000; air.gain.value = 2;
    limiter = audioCtx.createDynamicsCompressor(); limiter.threshold.value = -20; limiter.ratio.value = 9;
    src.connect(gainNode); gainNode.connect(subLow); subLow.connect(deepEngine);
    deepEngine.connect(clarity); clarity.connect(air); air.connect(limiter);
    limiter.connect(analyzer); analyzer.connect(audioCtx.destination);
    detectBeat();
}

let lastBeat = 0;
function detectBeat() {
    if (!analyzer) return;
    const dataArray = new Uint8Array(analyzer.frequencyBinCount);
    analyzer.getByteFrequencyData(dataArray);
    let avgLow = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
    const sensitivity = parseFloat(document.getElementById('slider').value) || 0;
    if (sensitivity > 0 && avgLow > 210 && audioCtx.currentTime - lastBeat > 0.15) {
        deepEngine.gain.setTargetAtTime(sensitivity * 1.5, audioCtx.currentTime, 0.01);
        lastBeat = audioCtx.currentTime;
        setTimeout(() => { if(deepEngine) deepEngine.gain.setTargetAtTime(sensitivity, audioCtx.currentTime, 0.15); }, 100);
    }
    requestAnimationFrame(detectBeat);
}

// LÓGICA DE LISTAS
const VIDEO_FOLDERS = {
    'Divas': 'https://raw.githubusercontent.com/juanxforever/Dv/refs/heads/main/Div.json',
    'Qmbia': 'https://raw.githubusercontent.com/juanxforever/Q/refs/heads/main/qmbia.s.json',
    'Latinoamericana': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Aya.c/refs/heads/main/jsskkkk.json',
    'Japón': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Jp.n/refs/heads/main/jpn.json',
    'Baladas': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Bl./refs/heads/main/bsss.json',
    'Folclore': 'https://archive.org/download/xd_20251013/jssk.json',
    'Pop': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Dip.o.p/refs/heads/main/jsskk.json',
    'Grupero': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Grp/refs/heads/main/jsskkk.json',
    'Rock Esp': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/rr/refs/heads/main/rc.json',
    'Bachata': 'https://archive.org/download/vvvvvvvx/Bchvvc.json',
    'Tecno': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Tcno/refs/heads/main/TcElec.json',
    'Salsa': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Ccc/refs/heads/main/Sssss.json',
    'Boleros': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Bo../refs/heads/main/Bol..json',
    'Rock Ing': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Ringles/refs/heads/main/Ringles.json',
    'Cumbias': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/q./refs/heads/main/q...json',
    'Criolla': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Crll/refs/heads/main/C.lla.json',
    'Disco': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Dic..c/refs/heads/main/Idisco.json',
    'Huaynos': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Hyns/refs/heads/main/hyn.json',
    'Regueton': 'https://raw.githubusercontent.com/refinadorlegendary-rgb/Rg/refs/heads/main/Rgtn.json'
};

const MP3_FOLDERS = {
    viejitos: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/main/Viejitos.json',
    lambadas: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/main/Lambadas.json',
    disco: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/main/Disco.json',
    rock: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/main/rockalternativo.json',
    colombiana: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/main/FiestaColombiana.json',
    salsa_oro: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/SalsadeOro.json',
    salsa_sensual: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Salsa%20sensual.json',
    tecno_clasico: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Tecno%20Cl%C3%A1sico.json',
    tecno_reggae: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Teckno%20Reggae.json',
    boleros: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Boleros%20Cantineros.json',
    vals_oro: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Vals%20Discos%20de%20Oro.json',
    rancheras: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Rancheras.json',
    vallenato: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Vallenato.json',
    baladas_oro: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Baladas%20de%20Oro.json',
    baladas_80s: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Baladas%20de%20Oro80s.json',
    baladas_clasicas: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Baladas.json',
    regueton_clasico: 'https://raw.githubusercontent.com/Juan221221/VBi.en.ji.to.s.ca.liwntes/refs/heads/main/Reguet%C3%B3n%20cl%C3%A1sicos.json'
};

async function loadAllMusic() {
    const folders = isMp3Mode ? MP3_FOLDERS : VIDEO_FOLDERS;
    genreScroller.innerHTML = '<button class="filter-btn active" onclick="filterByGenre(\'all\', this)">TODOS</button>';
    
    const results = await Promise.all(Object.entries(folders).map(async ([genre, url]) => {
        try {
            const res = await fetch(url);
            const data = await res.json();
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = genre.toUpperCase();
            btn.onclick = () => filterByGenre(genre, btn);
            genreScroller.appendChild(btn);
            return data.map(item => ({ title: item.nombre || item.title, video: item.url || item.video, genre: genre, isMp3: isMp3Mode }));
        } catch(e) { return []; }
    }));
    PLAYLIST = [...LOCAL_PLAYLIST, ...results.flat().filter(s => s.video)];
    filterByGenre('all');
}

function filterByGenre(genre, btn) {
    if(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    FILTERED_PLAYLIST = genre === 'all' ? [...PLAYLIST] : PLAYLIST.filter(t => t.genre === genre);
    idx = 0; renderList(); if(FILTERED_PLAYLIST.length > 0) loadTrack(0);
}

function renderList() {
    const center = document.getElementById('center');
    center.innerHTML = '';
    const frag = document.createDocumentFragment();
    FILTERED_PLAYLIST.forEach((tr, i) => {
        const d = document.createElement('div');
        d.className = 'track' + (i === idx ? ' active' : '');
        d.id = 'tr-' + i;
        d.innerHTML = `<div class="track-info"><div class="track-title">${tr.title}</div><div class="track-genre">${tr.genre}</div></div>`;
        d.onclick = () => loadTrack(i);
        frag.appendChild(d);
    });
    center.appendChild(frag);
}

function loadTrack(i) {
    if (!FILTERED_PLAYLIST[i]) return;
    idx = i;
    localStorage.setItem('carIdx', idx);
    vP.src = FILTERED_PLAYLIST[i].video;
    vP.load();
    vP.play().catch(e => {});
    document.getElementById('fs-wrapper').classList.toggle('mp3-active', FILTERED_PLAYLIST[i].isMp3);
    
    document.querySelectorAll('.track').forEach(t => t.classList.remove('active'));
    const current = document.getElementById('tr-' + i);
    if(current) {
        current.classList.add('active');
        current.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

// EVENTOS Y CONTROLES
vP.onplay = () => { initAudioEngine(); if(audioCtx) audioCtx.resume(); document.getElementById('play').textContent = '◼️'; document.getElementById('play-fs').textContent = '◼️'; };
vP.onpause = () => { document.getElementById('play').textContent = '▶'; document.getElementById('play-fs').textContent = '▶'; };
vP.onended = () => loadTrack((idx + 1) % FILTERED_PLAYLIST.length);
vP.ontimeupdate = () => {
    if (vP.duration) {
        bar.style.width = (vP.currentTime / vP.duration) * 100 + "%";
        songTimeDisplay.textContent = formatTime(vP.currentTime) + " / " + formatTime(vP.duration);
    }
};

progressCont.onclick = (e) => {
    const rect = progressCont.getBoundingClientRect();
    vP.currentTime = ((e.clientX - rect.left) / rect.width) * vP.duration;
};

document.getElementById('play').onclick = () => vP.paused ? vP.play() : vP.pause();
document.getElementById('next').onclick = () => nextT();
document.getElementById('prev').onclick = () => prevT();
document.getElementById('toggleMute').onclick = () => { vP.muted = !vP.muted; document.getElementById('toggleMute').textContent = vP.muted ? '🔇' : '🔊'; };

document.getElementById('fullscreen').onclick = () => {
    fsContainer.appendChild(vP); fsContainer.classList.add('active');
    if (fsContainer.requestFullscreen) fsContainer.requestFullscreen();
    toggleFSUI();
};

function exitFS(e) { if(e) e.stopPropagation(); if (document.exitFullscreen) document.exitFullscreen(); document.getElementById('fs-wrapper').appendChild(vP); fsContainer.classList.remove('active'); }
function toggleFSUI() { clearTimeout(fsUITimer); fsControls.classList.add('visible'); fsUITimer = setTimeout(() => { if(fsContainer.classList.contains('active')) fsControls.classList.remove('visible'); }, 3000); }
function playT(e) { e.stopPropagation(); vP.paused ? vP.play() : vP.pause(); }
function nextT(e) { if(e) e.stopPropagation(); loadTrack((idx + 1) % FILTERED_PLAYLIST.length); }
function prevT(e) { if(e) e.stopPropagation(); loadTrack((idx - 1 + FILTERED_PLAYLIST.length) % FILTERED_PLAYLIST.length); }

document.getElementById('slider').oninput = (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('dbVal').innerText = v;
    if (audioCtx) {
        subLow.gain.setTargetAtTime(v * 0.58, audioCtx.currentTime, 0.1);
        deepEngine.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
        gainNode.gain.setTargetAtTime(Math.max(0.4 - (v * 0.006), 0.15), audioCtx.currentTime, 0.1);
    }
};

document.getElementById('driving').onchange = () => document.body.classList.toggle('audio-only', document.getElementById('driving').checked);

function toggleSourceType() {
    isMp3Mode = !isMp3Mode;
    document.getElementById('fixed-mp3-btn').innerText = isMp3Mode ? "VIDEO" : "MP3";
    loadAllMusic();
}

function handleFiles(files) {
    for (let file of files) {
        LOCAL_PLAYLIST.push({ title: file.name.replace(/\.[^/.]+$/, ""), video: URL.createObjectURL(file), genre: "LOCAL", isMp3: true });
    }
    loadAllMusic();
}

function formatTime(s) {
    const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
    return m.toString().padStart(2, '0') + ":" + sec.toString().padStart(2, '0');
}

loadAllMusic();
</script>
</body>
</html>
