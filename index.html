<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cyber TV Player</title>
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6ac6cdcaf56c8b2994a412d2/2316a70bb_generated_image.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a12;
            --panel: #12121c;
            --panel2: #1a1a2b;
            --cyan: #00ffcc;
            --magenta: #ff007f;
            --gold: #ffd700;
        }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--cyan);
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: rgba(18,18,28,0.9);
            border-bottom: 1px solid rgba(0,255,204,0.2);
            padding: 8px 16px;
            flex-shrink: 0;
        }
        .top-row { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand img { width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(0,255,204,0.4); box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .brand span { font-family: 'Orbitron', sans-serif; color: var(--magenta); font-size: 13px; letter-spacing: 0.2em; }
        .search-wrap { position: relative; flex: 1; max-width: 400px; }
        .search-wrap .material-icons { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(0,255,204,0.6); font-size: 18px; }
        #search {
            width: 100%; padding: 6px 12px 6px 36px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,255,204,0.3);
            border-radius: 6px;
            color: var(--cyan);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            outline: none;
        }
        #search::placeholder { color: rgba(0,255,204,0.4); }
        #search:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,255,204,0.5); }

        /* COUNTRY TABS */
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs { -ms-overflow-style: none; scrollbar-width: none; }
        .tab {
            flex-shrink: 0;
            background: var(--panel2);
            color: var(--cyan);
            border: 1px solid rgba(0,255,204,0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .tab.active { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }

        /* MAIN GRID */
        main { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .count { font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(0,255,204,0.6); margin-bottom: 8px; letter-spacing: 0.05em; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1000px) { .grid { grid-template-columns: repeat(6, 1fr); } }
        @media (min-width: 1400px) { .grid { grid-template-columns: repeat(8, 1fr); } }

        .card {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 8px; border-radius: 8px;
            background: var(--panel);
            border: 1px solid rgba(0,255,204,0.2);
            cursor: pointer; text-align: center;
        }
        .card .logo { width: 50px; height: 50px; object-fit: contain; background: rgba(0,0,0,0.4); border-radius: 6px; }
        .card .ph { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgba(0,255,204,0.4); background: rgba(0,0,0,0.4); border-radius: 6px; }
        .card .name { font-size: 11px; color: var(--cyan); line-height: 1.1; min-height: 24px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card .country { font-family: 'Orbitron', sans-serif; font-size: 8px; color: var(--magenta); }

        .load-more { display: block; margin: 15px auto; padding: 6px 16px; background: var(--panel); border: 1px solid rgba(0,255,204,0.4); color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 11px; border-radius: 6px; cursor: pointer; }

        /* FOCUS */
        [data-nav]:focus { outline: 2px solid var(--cyan); outline-offset: 2px; }

        /* LOADING INICIAL */
        #loading { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 5000; }
        #loading.show { display: flex; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(0,255,204,0.3); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading span { font-family: 'Orbitron', sans-serif; color: rgba(0,255,204,0.7); letter-spacing: 0.1em; }

        /* FULLSCREEN MODERNO */
        #fs { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; }
        #fs.show { display: flex; }
        #fs video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        /* CARGADOR DE CANAL (Círculo Dorado) */
        #channelLoading {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            pointer-events: none;
        }
        #channelLoading.show { display: flex; }
        .golden-spinner {
            width: 64px;
            height: 64px;
            border: 5px solid rgba(255, 215, 0, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        #channelLoading span {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            font-size: 14px;
            letter-spacing: 0.2em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        .fs-bar { position: absolute; left: 0; right: 0; padding: 14px 20px; display: flex; transition: opacity 0.3s; z-index: 10001; }
        .fs-bar.top { top: 0; justify-content: space-between; align-items: flex-start; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .fs-bar.bottom { bottom: 0; justify-content: center; align-items: center; gap: 15px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .fs-bar.hidden { opacity: 0; pointer-events: none; }
        .fs-title { font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 15px; }
        .fs-sub { color: rgba(0,255,204,0.6); font-size: 11px; }
        .fs-btn { background: rgba(18,18,28,0.8); border: 1px solid rgba(0,255,204,0.4); color: var(--cyan); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .fs-btn.play { background: var(--cyan); color: #000; width: 50px; height: 50px; }
        .fs-btn.fav-on { background: var(--magenta); color: #000; border-color: var(--magenta); }
        .fs-btn .material-icons { font-size: 20px; }
        .fs-btn.play .material-icons { font-size: 26px; }

        /* MENÚ DE CALIDADES (SELECTOR CON TUERCA) */
        .quality-menu {
            position: absolute;
            bottom: 75px;
            right: 20px;
            background: rgba(18, 18, 28, 0.95);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 10002;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
            min-width: 110px;
        }
        .quality-menu.show { display: flex; }
        .quality-item {
            background: transparent;
            border: none;
            color: var(--cyan);
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            padding: 6px 12px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
        }
        .quality-item:hover, .quality-item.active {
            background: var(--cyan);
            color: #000;
        }

        .fs-status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; z-index: 10001; }
        .fs-status .err { font-family: 'Orbitron', sans-serif; color: var(--magenta); font-size: 18px; letter-spacing: 0.05em; }
        .fs-status .err-sub { color: rgba(0,255,204,0.6); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <div class="brand">
                <img src="https://media.base44.com/images/public/6ac6cdcaf56c8b2994a412d2/2316a70bb_generated_image.png" alt="Cyber TV">
                <span>TV ONLINE</span>
            </div>
            <div class="search-wrap">
                <span class="material-icons">search</span>
                <input type="text" id="search" data-nav placeholder="BUSCAR CANAL...">
            </div>
        </div>
        <div class="tabs" id="tabs"></div>
    </header>

    <main>
        <div class="count" id="count"></div>
        <div class="grid" id="grid"></div>
        <button class="load-more" id="loadMore" data-nav style="display:none">CARGAR MÁS</button>
    </main>

    <div id="loading"><div class="spinner"></div><span>CARGANDO CANALES...</span></div>

    <div id="fs">
        <!-- Reproductor de video personalizado sin controles nativos -->
        <video id="video" playsinline autoplay></video>
        
        <!-- CARGADOR DE CANAL (Círculo Dorado) -->
        <div id="channelLoading" class="show">
            <div class="golden-spinner"></div>
            <span>CARGANDO CANAL...</span>
        </div>

        <div id="fsStatus" style="display:none">
            <div class="err">SEÑAL NO DISPONIBLE</div>
            <div class="err-sub" id="fsErrName"></div>
        </div>

        <div class="fs-bar top" id="fsTop">
            <div>
                <div class="fs-title" id="fsTitle"></div>
                <div class="fs-sub" id="fsSub"></div>
            </div>
            <button class="fs-btn" data-nav onclick="exitFS()"><span class="material-icons">close</span></button>
        </div>

        <!-- Menú desplegable de calidades -->
        <div class="quality-menu" id="qualityMenu"></div>

        <div class="fs-bar bottom" id="fsBottom">
            <button class="fs-btn" data-nav onclick="prevChannel()"><span class="material-icons">skip_previous</span></button>
            <button class="fs-btn play" data-nav id="playBtn" onclick="togglePlay()"><span class="material-icons" id="playIcon">pause</span></button>
            <button class="fs-btn" data-nav onclick="nextChannel()"><span class="material-icons">skip_next</span></button>
            <button class="fs-btn" data-nav id="favBtn" onclick="toggleFav()"><span class="material-icons" id="favIcon">star_border</span></button>
            <button class="fs-btn" data-nav id="settingsBtn" onclick="toggleQualityMenu()"><span class="material-icons">settings</span></button>
        </div>
    </div>

    <script>
        const M3U_LISTS = [
            { country: 'Argentina', flag: '🇦🇷', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ar.m3u' },
            { country: 'Bolivia', flag: '🇧🇴', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/bo.m3u' },
            { country: 'Brasil', flag: '🇧🇷', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u' },
            { country: 'Chile', flag: '🇨🇱', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cl.m3u' },
            { country: 'Colombia', flag: '🇨🇴', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/co.m3u' },
            { country: 'Costa Rica', flag: '🇨🇷', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cr.m3u' },
            { country: 'Cuba', flag: '🇨🇺', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cu.m3u' },
            { country: 'Rep. Dominicana', flag: '🇩🇴', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/do.m3u' },
            { country: 'Ecuador', flag: '🇪🇨', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ec.m3u' },
            { country: 'El Salvador', flag: '🇸🇻', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/sv.m3u' },
            { country: 'Guatemala', flag: '🇬🇹', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/gt.m3u' },
            { country: 'Honduras', flag: '🇭🇳', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/hn.m3u' },
            { country: 'México', flag: '🇲🇽', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/mx.m3u' },
            { country: 'Nicaragua', flag: '🇳🇮', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ni.m3u' },
            { country: 'Panamá', flag: '🇵🇦', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/pa.m3u' },
            { country: 'Paraguay', flag: '🇵🇾', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/py.m3u' },
            { country: 'Perú', flag: '🇵🇪', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/pe.m3u' },
            { country: 'Puerto Rico', flag: '🇵🇷', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/pr.m3u' },
            { country: 'Uruguay', flag: '🇺🇾', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/uy.m3u' },
            { country: 'Venezuela', flag: '🇻🇪', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ve.m3u' },
            { country: 'España', flag: '🇪🇸', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/es.m3u' },
            { country: 'Rusia', flag: '🇷🇺', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ru.m3u' },
            { country: 'China', flag: '🇨🇳', url: 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cn.m3u' }
        ];

        const TABS = [
            { country: 'ALL', label: 'TODAS', flag: '📁' },
            { country: 'FAVORITES', label: 'FAVORITOS', flag: '❤️' },
            ...M3U_LISTS.map(c => ({ country: c.country, label: c.country.toUpperCase(), flag: c.flag }))
        ];

        let PLAYLIST = [], FILTERED = [], currentIdx = 0, currentFolder = 'ALL', visibleCount = 300;
        let favorites = JSON.parse(localStorage.getItem('cyber_tv_favorites') || '[]');
        let hls = null, ghostTimer = null, isFS = false;

        const video = document.getElementById('video');
        const fsEl = document.getElementById('fs');
        const fsStatus = document.getElementById('fsStatus');
        const fsErrName = document.getElementById('fsErrName');
        const fsTitle = document.getElementById('fsTitle');
        const fsSub = document.getElementById('fsSub');
        const fsTop = document.getElementById('fsTop');
        const fsBottom = document.getElementById('fsBottom');
        const playIcon = document.getElementById('playIcon');
        const favIcon = document.getElementById('favIcon');
        const favBtn = document.getElementById('favBtn');
        const channelLoading = document.getElementById('channelLoading');
        const qualityMenu = document.getElementById('qualityMenu');

        const tabsEl = document.getElementById('tabs');
        TABS.forEach(t => {
            const b = document.createElement('button');
            b.className = 'tab' + (t.country === 'ALL' ? ' active' : '');
            b.dataset.nav = '';
            b.textContent = t.flag + ' ' + t.label;
            b.onclick = () => { currentFolder = t.country; document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); b.classList.add('active'); visibleCount = 300; applyFilters(false); };
            tabsEl.appendChild(b);
        });

        async function init() {
            document.getElementById('loading').classList.add('show');
            const results = await Promise.all(M3U_LISTS.map(async c => {
                try {
                    const res = await fetch(c.url);
                    if (res.ok) return parseM3U(await res.text(), c.country, c.flag);
                } catch (e) {}
                return [];
            }));
            PLAYLIST = results.flat();
            document.getElementById('loading').classList.remove('show');
            applyFilters(false);
        }

        function parseM3U(content, folder, flag) {
            const lines = content.split('\n');
            let name = '', logo = '';
            const items = [];
            lines.forEach(line => {
                const t = line.trim();
                if (t.startsWith('#EXTINF:')) {
                    const m = t.match(/(?:tvg-logo|logo)=["']?([^"'\s,]+)["']?/i);
                    logo = m ? m[1] : '';
                    const p = t.split(',');
                    name = p.length > 1 ? p.slice(1).join(',').trim() : 'Canal';
                } else if (t && !t.startsWith('#')) {
                    items.push({ name: name || 'Canal', folder, flag, url: t, logo: logo || '' });
                }
            });
            return items;
        }

        function applyFilters(autoplay) {
            const s = document.getElementById('search').value.toLowerCase();
            FILTERED = PLAYLIST.filter(ch => {
                const okC = currentFolder === 'ALL' ? true : currentFolder === 'FAVORITES' ? favorites.includes(ch.url) : ch.folder === currentFolder;
                const okS = !s || ch.name.toLowerCase().includes(s) || ch.folder.toLowerCase().includes(s);
                return okC && okS;
            });
            document.getElementById('count').textContent = FILTERED.length + ' CANALES';
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const list = FILTERED.slice(0, visibleCount);
            if (!FILTERED.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#ff007f;font-family:Orbitron">NO HAY CANALES EN ESTA SECCIÓN</div>';
                document.getElementById('loadMore').style.display = 'none';
                return;
            }
            list.forEach((ch, i) => {
                const card = document.createElement('button');
                card.className = 'card';
                card.dataset.nav = '';
                const media = ch.logo
                    ? `<img class="logo" src="${ch.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="ph" style="display:none">📺</span>`
                    : `<span class="ph">📺</span>`;
                card.innerHTML = `${media}<span class="name">${ch.name}</span><span class="country">${ch.flag} ${ch.folder}</span>`;
                card.onclick = () => playItem(i);
                grid.appendChild(card);
            });
            document.getElementById('loadMore').style.display = visibleCount < FILTERED.length ? 'block' : 'none';
        }

        document.getElementById('loadMore').onclick = () => { visibleCount += 300; render(); };
        document.getElementById('search').oninput = () => { visibleCount = 300; applyFilters(false); };

        function playItem(i) {
            currentIdx = i;
            const ch = FILTERED[i];
            if (!ch) return;
            openFS(ch);
            loadStream(ch.url);
        }

        function loadStream(url) {
            video.pause();
            if (hls) { hls.destroy(); hls = null; }
            fsStatus.style.display = 'none';
            channelLoading.classList.add('show');
            qualityMenu.classList.remove('show');

            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                    buildQualityMenu(hls.levels);
                });
                hls.on(Hls.Events.ERROR, (_, d) => {
                    if (d.fatal) {
                        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hls.recoverMediaError();
                        } else {
                            channelLoading.classList.remove('show');
                            fsStatus.style.display = 'flex';
                            fsErrName.textContent = FILTERED[currentIdx]?.name || '';
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(() => {});
            } else {
                video.src = url;
            }
        }

        video.addEventListener('playing', () => {
            channelLoading.classList.remove('show');
        });

        function buildQualityMenu(levels) {
            qualityMenu.innerHTML = '';
            if (!levels || levels.length <= 1) {
                // Si el stream tiene una sola calidad o ninguna múltiple detectada
                document.getElementById('settingsBtn').style.display = 'none';
                return;
            }
            document.getElementById('settingsBtn').style.display = 'flex';

            // Opción Auto
            const autoBtn = document.createElement('button');
            autoBtn.className = 'quality-item' + (hls.currentLevel === -1 ? ' active' : '');
            autoBtn.textContent = 'Auto';
            autoBtn.onclick = () => {
                hls.currentLevel = -1;
                updateQualityMenuUI();
                qualityMenu.classList.remove('show');
            };
            qualityMenu.appendChild(autoBtn);

            levels.forEach((lvl, index) => {
                const btn = document.createElement('button');
                btn.className = 'quality-item' + (hls.currentLevel === index ? ' active' : '');
                btn.textContent = lvl.height ? lvl.height + 'p' : `Calidad ${index + 1}`;
                btn.onclick = () => {
                    hls.currentLevel = index;
                    updateQualityMenuUI();
                    qualityMenu.classList.remove('show');
                };
                qualityMenu.appendChild(btn);
            });
        }

        function updateQualityMenuUI() {
            const items = qualityMenu.querySelectorAll('.quality-item');
            items.forEach((btn, idx) => {
                if (idx === 0) {
                    btn.classList.toggle('active', hls.currentLevel === -1);
                } else {
                    btn.classList.toggle('active', hls.currentLevel === idx - 1);
                }
            });
        }

        function toggleQualityMenu() {
            qualityMenu.classList.toggle('show');
            flashControls();
        }

        function openFS(ch) {
            isFS = true;
            fsTitle.textContent = ch.name;
            fsSub.textContent = ch.flag + ' ' + ch.folder + ' · ' + (currentIdx + 1) + '/' + FILTERED.length;
            fsEl.classList.add('show');
            channelLoading.classList.add('show');
            updateFavBtn();
            flashControls();

            try {
                if (fsEl.requestFullscreen) {
                    fsEl.requestFullscreen();
                } else if (fsEl.webkitRequestFullscreen) {
                    fsEl.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {}
        }

        function exitFS() {
            isFS = false;
            fsEl.classList.remove('show');
            channelLoading.classList.remove('show');
            qualityMenu.classList.remove('show');
            video.pause();
            if (hls) { hls.destroy(); hls = null; }
            clearTimeout(ghostTimer);

            try {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            } catch (e) {}
        }

        function nextChannel() { if (currentIdx < FILTERED.length - 1) playItem(currentIdx + 1); }
        function prevChannel() { if (currentIdx > 0) playItem(currentIdx - 1); }

        function togglePlay() {
            if (video.paused) { video.play().then(() => playIcon.textContent = 'pause').catch(() => {}); }
            else { video.pause(); playIcon.textContent = 'play_arrow'; }
        }
        video.addEventListener('play', () => playIcon.textContent = 'pause');
        video.addEventListener('pause', () => playIcon.textContent = 'play_arrow');

        function toggleFav() {
            const ch = FILTERED[currentIdx]; if (!ch) return;
            const i = favorites.indexOf(ch.url);
            if (i > -1) favorites.splice(i, 1); else favorites.push(ch.url);
            localStorage.setItem('cyber_tv_favorites', JSON.stringify(favorites));
            updateFavBtn();
            if (currentFolder === 'FAVORITES') applyFilters(false);
        }
        function updateFavBtn() {
            const ch = FILTERED[currentIdx];
            const on = ch && favorites.includes(ch.url);
            favIcon.textContent = on ? 'star' : 'star_border';
            favBtn.classList.toggle('fav-on', !!on);
        }

        function flashControls() {
            fsTop.classList.remove('hidden');
            fsBottom.classList.remove('hidden');
            clearTimeout(ghostTimer);
            ghostTimer = setTimeout(() => {
                fsTop.classList.add('hidden');
                fsBottom.classList.add('hidden');
                qualityMenu.classList.remove('show');
            }, 4000);
        }
        fsEl.addEventListener('mousemove', flashControls);
        fsEl.addEventListener('touchstart', flashControls);

        function moveFocus(dir) {
            const els = Array.from(document.querySelectorAll('[data-nav]'));
            if (!els.length) return;
            const active = document.activeElement;
            if (!active || !els.includes(active)) { els[0].focus(); return; }
            const r = active.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            let best = null, bestScore = Infinity;
            for (const el of els) {
                if (el === active) continue;
                const er = el.getBoundingClientRect();
                const ex = er.left + er.width / 2, ey = er.top + er.height / 2;
                const dx = ex - cx, dy = ey - cy;
                let score = null;
                if (dir === 'right' && dx > 1) score = dx + Math.abs(dy) * 2;
                else if (dir === 'left' && dx < -1) score = -dx + Math.abs(dy) * 2;
                else if (dir === 'down' && dy > 1) score = dy + Math.abs(dx) * 2;
                else if (dir === 'up' && dy < -1) score = -dy + Math.abs(dx) * 2;
                if (score != null && score < bestScore) { bestScore = score; best = el; }
            }
            if (best) best.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (isFS) {
                switch (e.key) {
                    case 'ArrowUp': case 'ChannelUp': e.preventDefault(); prevChannel(); flashControls(); break;
                    case 'ArrowDown': case 'ChannelDown': e.preventDefault(); nextChannel(); flashControls(); break;
                    case 'Enter': case ' ': e.preventDefault(); togglePlay(); flashControls(); break;
                    case 'Escape': case 'Back': case 'Backspace': e.preventDefault(); exitFS(); break;
                    default: flashControls();
                }
            } else {
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                    moveFocus(e.key.replace('Arrow','').toLowerCase());
                }
            }
        });

        init();
    </script>
</body>
</html>
