<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarPlayer Pro + Soundboard Multi-Banco</title>
  
  <!-- SCRIPT NATIVO DE CAPACITOR -->
  <script src="capacitor.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 10px var(--glow-color, rgba(168, 85, 247, 0.4)), 
                    inset 0 0 8px var(--glow-color, rgba(168, 85, 247, 0.2));
        border-color: var(--border-color, rgba(168, 85, 247, 0.8));
      }
      50% {
        box-shadow: 0 0 20px var(--glow-color, rgba(168, 85, 247, 0.9)), 
                    inset 0 0 12px var(--glow-color, rgba(168, 85, 247, 0.5));
        border-color: #ffffff;
      }
    }

    @keyframes spin-disk-ultra {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes stop-disk-gradual {
      from { transform: rotate(var(--stopped-angle, 0deg)); }
      to { transform: rotate(calc(var(--stopped-angle, 0deg) + 720deg)); }
    }

    @keyframes gradient-bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .exit-gradient-bg {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #000000);
      background-size: 400% 400%;
      animation: gradient-bg 6s ease infinite;
    }

    .spinning-disk {
      animation: spin-disk-ultra 0.3s linear infinite;
    }

    .stopping-disk {
      animation: stop-disk-gradual 1.8s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
    }

    .beat-active {
      animation: pulse-glow 0.6s infinite ease-in-out;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    .sampler-container {
      background-color: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 10px;
      touch-action: pan-y;
      user-select: none;
    }

    .soundboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      overflow-y: auto;
      padding-right: 4px;
    }

    @media (min-width: 768px) {
      .soundboard-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .btn-sound {
      border: none;
      border-radius: 6px;
      color: #ffffff;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      cursor: pointer;
      min-height: 60px;
      box-shadow: inset 0 0 5px rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .btn-sound:active {
      transform: scale(0.95);
      filter: brightness(1.2);
    }

    .btn-sound.playing {
      outline: 3px solid #ffffff;
      box-shadow: 0 0 10px #ffffff;
    }

    .pad-tag {
      font-size: 0.55rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 4px;
      border-radius: 3px;
      color: #fff;
    }

    .btn-sound .label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1.1;
      text-align: left;
      width: 100%;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .color-0 { background-color: #00bcd4; }
    .color-1 { background-color: #2196f3; }
    .color-2 { background-color: #e91e63; }
    .color-3 { background-color: #ff9800; }
    .color-4 { background-color: #ffeb3b; color: #000; }
    .color-5 { background-color: #00e676; color: #000; }
    .color-6 { background-color: #9c27b0; }

    .bank-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding-top: 6px;
      border-top: 1px solid #222;
    }

    .btn-bank {
      background-color: #22222b;
      color: #888899;
      border: 1px solid #333344;
      border-radius: 4px;
      padding: 5px 2px;
      font-size: 0.6rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
    }

    .btn-bank:nth-child(1).active { background-color: #00bcd4; color: #000; border-color: #fff; box-shadow: 0 0 6px #00bcd4; }
    .btn-bank:nth-child(2).active { background-color: #2196f3; color: #fff; border-color: #fff; box-shadow: 0 0 6px #2196f3; }
    .btn-bank:nth-child(3).active { background-color: #e91e63; color: #fff; border-color: #fff; box-shadow: 0 0 6px #e91e63; }
    .btn-bank:nth-child(4).active { background-color: #ff9800; color: #000; border-color: #fff; box-shadow: 0 0 6px #ff9800; }
    .btn-bank:nth-child(5).active { background-color: #00e676; color: #000; border-color: #fff; box-shadow: 0 0 6px #00e676; }
    .btn-bank:nth-child(6).active { background-color: #9c27b0; color: #fff; border-color: #fff; box-shadow: 0 0 6px #9c27b0; }
  </style>
</head>

        <button class="btn-bank active" onclick="changeBank(0)">B1</button>

  <!-- PANTALLA DE SALIDA ANIMADA "GOOD BYE" CON IMAGEN Y SONIDO -->
  <div id="exit-screen" class="fixed inset-0 z-[100] exit-gradient-bg flex flex-col items-center justify-center hidden text-center px-4">
    <!-- Imagen real de despedida subida al repositorio -->
    <div class="w-44 h-44 sm:w-56 sm:h-56 mb-4 rounded-full overflow-hidden border-4 border-purple-500/80 shadow-[0_0_30px_rgba(168,85,247,0.5)] animate-bounce">
      <img src="adios.jpg" alt="Goodbye" class="w-full h-full object-cover">

    <h1 class="text-4xl sm:text-6xl md:text-7xl font-black text-white tracking-widest uppercase drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] animate-pulse select-none">
      GOOD BYE
    </h1>
    <p class="text-white/80 text-sm sm:text-lg font-medium mt-2 tracking-wide">Cerrando aplicación...</p>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script>
    // CONFIGURACIÓN DE SEGURIDAD PARA CLOUDFLARE WORKER
    const APP_SECRET_KEY = "CarPlayerProSecretKey123";

    async function secureFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'X-App-Request': APP_SECRET_KEY
      };
      return fetch(url, options);
    }

    function exitApp() {
      try {
        if (typeof pauseTrack === 'function') pauseTrack();
        if (activePlayer) { activePlayer.pause(); }
      } catch (e) {}

      const exitScreen = document.getElementById('exit-screen');
      const mainContainer = document.getElementById('main-app-container');
      const exitBtn = document.getElementById('btn-exit');

      if (mainContainer) mainContainer.style.display = 'none';
      if (exitBtn) exitBtn.style.display = 'none';
      if (exitScreen) exitScreen.classList.remove('hidden');

      // Reproducción del audio de despedida
      try {
        const goodbyeAudio = new Audio('_Goodbye_Meme_Sound_Effect_MP3_256kbp.mp3');
        goodbyeAudio.play().catch(err => console.log("Audio autoplay restringido:", err));
      } catch (err) {
        console.warn("No se pudo cargar el audio de despedida:", err);
      }

      setTimeout(() => {
        // Soporte para Capacitor App Plugin nativo
        if (window.Capacitor && window.Capacitor.Plugins) {
          const AppPlugin = window.Capacitor.Plugins.App || window.Capacitor.Plugins.AppPlugin;
          if (AppPlugin && typeof AppPlugin.exitApp === 'function') {
            AppPlugin.exitApp();
            return;
          }
        }
        if (window.Android && typeof window.Android.closeApp === 'function') {
          window.Android.closeApp();
          return;
        }
        if (window.Android && typeof window.Android.exitApp === 'function') {
          window.Android.exitApp();
          return;
        }
        if (navigator.app && typeof navigator.app.exitApp === 'function') {
          navigator.app.exitApp();
          return;
        }
        if (navigator.device && typeof navigator.device.exitApp === 'function') {
          navigator.device.exitApp();
          return;
        }
        window.close();
      }, 3000);
    }

    lucide.createIcons();

    const DEFAULT_DVD_LOGO = "https://raw.githubusercontent.com/pitufoardiente000/Mp.3/main/dvd-music-disk-vector-graphic-pixabay-23.png";

    let playlist = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let beatAnimationEnabled = true;

    const audio = document.getElementById('audio-player');
    const video = document.getElementById('video-player');
    const videoWrapper = document.getElementById('video-wrapper');
    const albumCover = document.getElementById('album-cover');
    const dvdImage = document.getElementById('dvd-image');

    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const trackGenre = document.getElementById('track-genre');
    const playingBadge = document.getElementById('playing-badge');
    const playlistContainer = document.getElementById('playlist-container');
    const playlistCount = document.getElementById('playlist-count');
    const toggleBeatColor = document.getElementById('toggle-beat-color');
    const toggle6D = document.getElementById('toggle-6d');
    const fileInput = document.getElementById('file-input');
    const playerGlow = document.getElementById('player-glow');

    let audioCtx = null;
    let currentBass = 29;
    let currentTweeter = 10;
    let currentDolby = 7;
    let mode6dEnabled = false;
    let pannerFrameId = null;

    const processed = new WeakSet();
    const engines = [];

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass({ latencyHint: 'playback' });
      }
      return audioCtx;
    }

    function attach(mediaEl) {
      if (!mediaEl || processed.has(mediaEl)) return;
      if (mediaEl.tagName !== 'VIDEO' && mediaEl.tagName !== 'AUDIO') return;

      try {
        const ctx = getAudioContext();
        const source = ctx.createMediaElementSource(mediaEl);
        const analyzer = ctx.createAnalyser();
        analyzer.fftSize = 512;

        const masterInput = ctx.createGain();
        masterInput.gain.value = 0.35;

        const bassSplitter = ctx.createGain();
        bassSplitter.gain.value = 1.0;

        const subsonicFilter = ctx.createBiquadFilter();
        subsonicFilter.type = 'highpass';
        subsonicFilter.frequency.value = 5; 
        subsonicFilter.Q.value = 1.1;

        const bassLowpass = ctx.createBiquadFilter();
        bassLowpass.type = 'lowpass';
        bassLowpass.frequency.value = 20; 
        bassLowpass.Q.value = 1.1;

        const subEngine = ctx.createBiquadFilter();
        subEngine.type = 'lowshelf';
        subEngine.frequency.value = 100;
        subEngine.gain.value = 0;

        const deepEngine = ctx.createBiquadFilter();
        deepEngine.type = 'peaking';
        deepEngine.frequency.value = 43;
        deepEngine.Q.value = 1.1;
        deepEngine.gain.value = 0;

        const bassCompressor = ctx.createDynamicsCompressor();
        bassCompressor.threshold.value = -18.0; 
        bassCompressor.knee.value = 16.0;       
        bassCompressor.ratio.value = 16.0;      
        bassCompressor.attack.value = 0.001;    
        bassCompressor.release.value = 0.3;

        const thermalGuard = ctx.createBiquadFilter();
        thermalGuard.type = 'peaking';
        thermalGuard.frequency.value = 75;
        thermalGuard.Q.value = 0.7;
        thermalGuard.gain.value = -3.0; 

        const bassOutput = ctx.createGain();
        bassOutput.gain.value = 1.0;

        const mainSplitter = ctx.createGain();
        mainSplitter.gain.value = 1.0;

        const clarity = ctx.createBiquadFilter();
        clarity.type = 'peaking';
        clarity.frequency.value = 2800;
        clarity.gain.value = 8;

        const air = ctx.createBiquadFilter();
        air.type = 'highshelf';
        air.frequency.value = 12000;
        air.gain.value = 6;

        const mainOutput = ctx.createGain();
        mainOutput.gain.value = 1.0;

        const tweeterNode = ctx.createBiquadFilter();
        tweeterNode.type = 'highshelf';
        tweeterNode.frequency.value = 10000;
        tweeterNode.gain.value = 0;

        const dolbyNode = ctx.createBiquadFilter();
        dolbyNode.type = 'peaking';
        dolbyNode.frequency.value = 6000;
        dolbyNode.Q.value = 1.0;
        dolbyNode.gain.value = 0;

        const panner6D = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        const masterSum = ctx.createGain();
        masterSum.gain.value = 0.95;

        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.value = -12.0;
        limiter.knee.value = 10.0;
        limiter.ratio.value = 12;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.15;

        source.connect(masterInput);
        masterInput.connect(bassSplitter);
        bassSplitter.connect(subsonicFilter);
        subsonicFilter.connect(bassLowpass);
        bassLowpass.connect(subEngine);
        subEngine.connect(deepEngine);
        deepEngine.connect(bassCompressor);
        bassCompressor.connect(thermalGuard);
        thermalGuard.connect(bassOutput);
        bassOutput.connect(masterSum);

        masterInput.connect(mainSplitter);
        mainSplitter.connect(clarity);
        clarity.connect(air);
        air.connect(mainOutput);

        mainOutput.connect(tweeterNode);
        tweeterNode.connect(dolbyNode);

        if (panner6D) {
          dolbyNode.connect(panner6D);
          panner6D.connect(masterSum);
        } else {
          dolbyNode.connect(masterSum);
        }

        masterSum.connect(limiter);
        limiter.connect(analyzer);
        analyzer.connect(ctx.destination);

        processed.add(mediaEl);
        const engine = {
          mediaEl, analyzer, masterInput, subEngine, deepEngine, tweeterNode, dolbyNode, panner6D, limiter,
          lastBeatTime: 0, beatThreshold: 0
        };
        engines.push(engine);

        applyBass(engine, currentBass);
        applyTweeter(engine, currentTweeter);
        applyDolby(engine, currentDolby);

      } catch (err) {
        console.warn('[CarPlayer Engine] Audio setup:', err.message);
      }
    }

    function applyBass(engine, v) {
      if (!audioCtx) return;
      engine.deepEngine.gain.setTargetAtTime(v * 1.1, audioCtx.currentTime, 0.25);
      engine.subEngine.gain.setTargetAtTime(v * 0.85, audioCtx.currentTime, 0.25);
      const vol = 0.35 - v * 0.005;
      engine.masterInput.gain.setTargetAtTime(Math.max(vol, 0.08), audioCtx.currentTime, 0.25);
    }

    function applyTweeter(engine, v) {
      if (!audioCtx) return;
      engine.tweeterNode.gain.setTargetAtTime(v * 1.1, audioCtx.currentTime, 0.1);
    }

    function applyDolby(engine, v) {
      if (!audioCtx) return;
      engine.dolbyNode.gain.setTargetAtTime(v * 0.9, audioCtx.currentTime, 0.1);
    }

    function tickBeat() {
      if (audioCtx && currentBass > 0) {
        engines.forEach((e) => {
          if (e.mediaEl.paused) return;
          const dataArray = new Uint8Array(e.analyzer.frequencyBinCount);
          e.analyzer.getByteFrequencyData(dataArray);

          let bassSum = 0;
          for (let i = 0; i < 6; i++) bassSum += dataArray[i];
          const currentBassLevel = bassSum / 6;

          e.beatThreshold = e.beatThreshold * 0.97 + currentBassLevel * 0.03;
          if (currentBassLevel > e.beatThreshold * 1.3 && audioCtx.currentTime - e.lastBeatTime > 0.16) {
            e.deepEngine.gain.setTargetAtTime((currentBass * 1.1) * 1.2, audioCtx.currentTime, 0.03);
            setTimeout(() => {
              if (e.deepEngine) e.deepEngine.gain.setTargetAtTime(currentBass * 1.1, audioCtx.currentTime, 0.18);
            }, 85);
            e.lastBeatTime = audioCtx.currentTime;
          }
        });
      }
      requestAnimationFrame(tickBeat);
    }
    tickBeat();

    function update6DPanner() {
      if (mode6dEnabled && audioCtx) {
        const t = audioCtx.currentTime;
        const panValue = Math.sin((2 * Math.PI * t) / 7.5) * 0.75;

        engines.forEach((e) => {
          if (e.panner6D && !e.mediaEl.paused) {
            e.panner6D.pan.setTargetAtTime(panValue, audioCtx.currentTime, 0.08);
          }
        });
        pannerFrameId = requestAnimationFrame(update6DPanner);
      } else {
        engines.forEach((e) => {
          if (e.panner6D && audioCtx) e.panner6D.pan.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        });
        if (pannerFrameId) cancelAnimationFrame(pannerFrameId);
      }
    }

    toggle6D.addEventListener('change', (e) => {
      mode6dEnabled = e.target.checked;
      update6DPanner();
    });

    function processJSONData(items) {
      const colors = ['#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4'];
      const gradients = ['from-amber-500 to-orange-600', 'from-blue-600 to-cyan-600', 'from-violet-600 to-purple-600', 'from-fuchsia-600 to-pink-600'];

      playlist = items.map((item, idx) => ({
        id: Date.now() + idx,
        title: item.title || item.nombre || "Sin Título",
        artist: item.artist || item.artista || "Desconocido",
        duration: item.duration || "--:--",
        genre: item.genre || item.genero || "Audio",
        type: item.type || (item.url && item.url.includes('.mp4') ? 'video' : 'audio'),
        color: colors[Math.floor(Math.random() * colors.length)],
        gradient: gradients[Math.floor(Math.random() * gradients.length)],
        src: item.src || item.url || "",
        cover: item.cover || item.caratula || item.image || DEFAULT_DVD_LOGO
      }));

      renderPlaylist();
      if (playlist.length > 0) loadTrack(0);
    }

    function getActiveMedia() {
      const track = playlist[currentTrackIndex];
      return (track && track.type === 'video') ? video : audio;
    }

    function loadTrack(index, savedTime = 0) {
      if (playlist.length === 0) return;
      pauseTrack();
      currentTrackIndex = index;
      const track = playlist[index];

      if (track.type === 'video') {
        videoWrapper.style.display = 'block';
        albumCover.style.display = 'none';
        video.src = track.src;
        attach(video);
        if (savedTime > 0) video.currentTime = savedTime;
      } else {
        videoWrapper.style.display = 'none';
        albumCover.style.display = 'flex';
        dvdImage.src = track.cover || DEFAULT_DVD_LOGO;
        audio.src = track.src;
        attach(audio);
        if (savedTime > 0) audio.currentTime = savedTime;
      }

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      trackGenre.textContent = track.genre;
      playerGlow.style.backgroundColor = track.color;

      renderPlaylist();
      scrollToActiveTrack();
    }

    function scrollToActiveTrack() {
      const activeCard = playlistContainer.children[currentTrackIndex];
      if (activeCard) {
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlistCount.textContent = `${playlist.length} archivos`;

      if (playlist.length === 0) {
        playlistContainer.innerHTML = `
          <div class="text-center py-4 text-slate-500 text-[11px] flex flex-col items-center justify-center h-full">
            <i data-lucide="music-4" class="w-6 h-6 mb-1 opacity-40"></i>
            <span>No hay archivos cargados.</span>
            <span class="text-[9px] text-slate-600">Usa "Importar" para agregar canciones o .json</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      playlist.forEach((track, index) => {
        const isCurrent = index === currentTrackIndex;
        const card = document.createElement('div');
        
        card.className = `group flex items-center justify-between p-2 rounded-xl border transition-all duration-300 cursor-pointer shrink-0 ${
          isCurrent 
            ? 'bg-slate-800/90 text-white border-slate-600 shadow-md' 
            : 'bg-slate-900/40 hover:bg-slate-800/50 text-slate-300 border-slate-800/80'
        }`;

        card.style.setProperty('--glow-color', track.color + 'aa');
        card.style.setProperty('--border-color', track.color);

        if (isCurrent && isPlaying && beatAnimationEnabled) {
          card.classList.add('beat-active');
        }

        const iconType = track.type === 'video' ? 'film' : 'disc';

        card.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-white font-bold text-xs shadow-sm shrink-0 overflow-hidden">
              ${isCurrent && isPlaying ? '<i data-lucide="volume-2" class="w-3.5 h-3.5 animate-bounce text-purple-400"></i>' : `<i data-lucide="${iconType}" class="w-3 h-3 text-slate-400"></i>`}
            </div>
            <div class="truncate">
              <h3 class="font-semibold text-[11px] truncate ${isCurrent ? 'text-white' : 'text-slate-200'}">${track.title}</h3>
              <p class="text-[9px] text-slate-400 truncate">${track.artist}</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0 ml-2">
            <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full border border-slate-700 bg-slate-800/80" style="color:${track.color}">
              ${track.genre}
            </span>
            <span class="text-[9px] font-mono text-slate-400">${track.duration}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          if (currentTrackIndex !== index) {
            loadTrack(index);
            playTrack();
          } else {
            togglePlay();
          }
        });

        playlistContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    function togglePlay() {
      if (playlist.length === 0) return;
      if (isPlaying) {
        pauseTrack();
      } else {
        playTrack();
      }
    }

    function startDiskSpin() {
      dvdImage.classList.remove('stopping-disk');
      dvdImage.classList.add('spinning-disk');
    }

    function stopDiskGradual() {
      if (!dvdImage.classList.contains('spinning-disk')) return;

      const computedStyle = window.getComputedStyle(dvdImage);
      const matrix = computedStyle.transform;
      let angle = 0;

      if (matrix && matrix !== 'none') {
        const values = matrix.split('(')[1].split(')')[0].split(',');
        const a = parseFloat(values[0]);
        const b = parseFloat(values[1]);
        angle = Math.round(Math.atan2(b, a) * (180 / Math.PI));
        if (angle < 0) angle += 360;
      }

      dvdImage.style.setProperty('--stopped-angle', `${angle}deg`);
      dvdImage.classList.remove('spinning-disk');
      
      void dvdImage.offsetWidth; 
      dvdImage.classList.add('stopping-disk');
    }

    function playTrack() {
      if (playlist.length === 0) return;
      const activeMedia = getActiveMedia();
      attach(activeMedia);

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      activeMedia.play().then(() => {
        isPlaying = true;
        playIcon.setAttribute('data-lucide', 'pause');
        playingBadge.style.opacity = '1';
        startDiskSpin();
        if (mode6dEnabled) update6DPanner();
        lucide.createIcons();
        renderPlaylist();
      }).catch(err => console.log("Interacción requerida:", err));
    }

    function pauseTrack() {
      audio.pause();
      video.pause();
      isPlaying = false;
      playIcon.setAttribute('data-lucide', 'play');
      playingBadge.style.opacity = '0';
      stopDiskGradual();
      lucide.createIcons();
      renderPlaylist();
    }

    btnPlay.addEventListener('click', togglePlay);
    btnPrev.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      playTrack();
    });
    btnNext.addEventListener('click', () => {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      playTrack();
    });

    function handleTimeUpdate(media) {
      if (!media.duration || media !== getActiveMedia()) return;
      progressBar.value = (media.currentTime / media.duration) * 100;

      const curMin = Math.floor(media.currentTime / 60);
      const curSec = Math.floor(media.currentTime % 60);
      const durMin = Math.floor(media.duration / 60);
      const durSec = Math.floor(media.duration % 60);

      currentTimeEl.textContent = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;
      totalDurationEl.textContent = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;

      if (isPlaying) {
        document.querySelectorAll('.bar').forEach(bar => {
          const randomHeight = Math.floor(Math.random() * 85) + 15;
          bar.style.height = `${randomHeight}%`;
        });
      }
    }

    audio.addEventListener('timeupdate', () => handleTimeUpdate(audio));
    video.addEventListener('timeupdate', () => handleTimeUpdate(video));

    audio.addEventListener('ended', () => {
      stopDiskGradual();
      btnNext.click();
    });
    video.addEventListener('ended', () => {
      stopDiskGradual();
      btnNext.click();
    });

    progressBar.addEventListener('input', () => {
      if (playlist.length === 0) return;
      const activeMedia = getActiveMedia();
      activeMedia.currentTime = (progressBar.value / 100) * activeMedia.duration;
    });

    toggleBeatColor.addEventListener('change', (e) => {
      beatAnimationEnabled = e.target.checked;
      renderPlaylist();
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const jsonFile = files.find(f => f.name.endsWith('.json'));
      if (jsonFile) {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            processJSONData(Array.isArray(data) ? data : data.playlist || []);
          } catch (err) {
            alert('Formato JSON inválido');
          }
        };
        reader.readAsText(jsonFile);
        return;
      }

      const colors = ['#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4'];
      const gradients = ['from-amber-500 to-orange-600', 'from-blue-600 to-cyan-600', 'from-violet-600 to-purple-600', 'from-fuchsia-600 to-pink-600'];

      const previousLength = playlist.length;

      files.forEach((file, idx) => {
        const objectUrl = URL.createObjectURL(file);
        const isVideo = file.type.startsWith('video/') || /\.(mp4|webm|ogg|mov|mkv)$/i.test(file.name);

        playlist.push({
          id: Date.now() + idx,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: isVideo ? "Video Local HD" : "Audio Local HD",
          duration: "--:--",
          genre: isVideo ? "Video" : "Audio",
          type: isVideo ? "video" : "audio",
          color: colors[Math.floor(Math.random() * colors.length)],
          gradient: gradients[Math.floor(Math.random() * gradients.length)],
          src: objectUrl,
          cover: DEFAULT_DVD_LOGO
        });
      });

      renderPlaylist();
      if (!isPlaying) {
        loadTrack(previousLength > 0 ? currentTrackIndex : 0);
      }
    });

    ['click', 'keydown', 'touchstart'].forEach(evt =>
      document.addEventListener(evt, () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }, { passive: true })
    );

    renderPlaylist();

    /* ----------------------------------------------------
       LÓGICA SOUNDBOARD MULTI-BANCO DE SONIDOS
    ---------------------------------------------------- */
    const USER = "Juancito221";
    const container = document.getElementById('soundboard');
    const swipeArea = document.getElementById('swipeArea');
    const bankButtons = document.querySelectorAll('.btn-bank');

    const banks = [
      'To.n.-0s',
      'To-n0-2',
      'To.n.-0s3',
      'To.n.-0s4',
      'To.n.-0s5',
      'To.n.-0s6'
    ];

    let currentBankIndex = 0;
    let activePlayer = null;
    const bankCache = {};

    function formatTitle(filename) {
      return filename
        .replace(/\.(mp3|wav|ogg|m4a|aac)$/i, '')
        .replace(/_MP3_\d+K/gi, '')
        .replace(/\(MP3_\d+K\)/gi, '')
        .replace(/_|-/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function renderBoard(audioFiles) {
      container.innerHTML = "";
      let padCount = 0;

      if (!audioFiles || audioFiles.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-xs text-slate-500 py-6">Sin sonidos disponibles en este banco.</div>`;
        return;
      }

      audioFiles.forEach((file) => {
        padCount++;
        const btn = document.createElement('div');
        const colorClass = `color-${(padCount - 1) % 7}`;
        btn.className = `btn-sound ${colorClass}`;

        btn.innerHTML = `
          <span class="pad-tag">PAD ${padCount}</span>
          <span class="label">${formatTitle(file.name)}</span>
        `;

        btn.addEventListener('click', () => {
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

          if (activePlayer) {
            activePlayer.pause();
            activePlayer.currentTime = 0;
            document.querySelectorAll('.btn-sound').forEach(b => b.classList.remove('playing'));
          }

          activePlayer = new Audio(file.download_url);
          activePlayer.volume = 0.5;
          btn.classList.add('playing');

          activePlayer.play().catch(err => console.error("Error al reproducir pad:", err));

          activePlayer.onended = () => {
            btn.classList.remove('playing');
          };
        });

        container.appendChild(btn);
      });
    }

    async function loadGitHubSounds(index) {
      const repoName = banks[index];

      if (bankCache[repoName]) {
        renderBoard(bankCache[repoName]);
        return;
      }

      const GITHUB_API_URL = `https://api.github.com/repos/${USER}/${repoName}/contents/`;

      try {
        const response = await secureFetch(GITHUB_API_URL);
        if (!response.ok) throw new Error("Error al acceder al repositorio");

        const files = await response.json();
        const audioFiles = files.filter(file => 
          file.type === "file" && /\.(mp3|wav|ogg|m4a|aac)$/i.test(file.name)
        );

        bankCache[repoName] = audioFiles;
        renderBoard(audioFiles);

      } catch (error) {
        console.error("Error al cargar audios de GitHub:", error);
        renderBoard([]);
      }
    }

    function changeBank(index) {
      if (index < 0 || index >= banks.length) return;
      
      currentBankIndex = index;
      bankButtons.forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      loadGitHubSounds(currentBankIndex);
    }

    let touchStartX = 0;
    let touchEndX = 0;

    swipeArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    swipeArea.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      const minSwipeDistance = 50;

      if (swipeDistance < -minSwipeDistance) {
        if (currentBankIndex < banks.length - 1) {
          changeBank(currentBankIndex + 1);
        }
      } else if (swipeDistance > minSwipeDistance) {
        if (currentBankIndex > 0) {
          changeBank(currentBankIndex - 1);
        }
      }
    }

    changeBank(0);
  </script>
</body>
</html>
