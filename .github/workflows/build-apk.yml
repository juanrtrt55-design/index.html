name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android hls.js

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html www/

      - name: Añadir plataforma Android y Sincronizar
        run: |
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
