name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html www/

      - name: Inicializar y Sincronizar Capacitor
        run: |
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayerPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
