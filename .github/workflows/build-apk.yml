name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de build
        run: npm run build

      - name: Inicializar y Sincronizar Capacitor
        run: |
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Parche pantalla completa (edge-to-edge)
        run: |
          cat > android/app/src/main/java/com/tuempresa/cybertv/MainActivity.kt << 'EOF'
          package com.tuempresa.cybertv

          import android.os.Bundle
          import androidx.core.view.WindowCompat
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
              }
          }
          EOF

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de Depuracion (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
